<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Frontend Mentor | Huddle landing page</title>

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../assets//images/favicon-32x32.png"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Open+Sans:wght@400&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="output.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
  </head>

  <body
    class="bg-primary font-secondary flex h-screen flex-col bg-[url('../assets/images/bg-mobile.svg')] bg-top bg-size-[100%] md:bg-cover md:bg-center bg-no-repeat px-9 py-10 text-white md:bg-[url('../assets/images/bg-desktop.svg')] md:px-16 md:py-16"
  >
    <header class="mb-16 flex justify-start">
      <img
        src="../assets/images/logo.svg"
        alt="Huddle Logo"
        class="w-30 md:w-50"
      />
    </header>

    <main
      class="grid flex-1 justify-items-center text-center md:grid-cols-2 md:items-center md:gap-14 md:text-start"
    >
      <img
        src="../assets/images/illustration-mockups.svg"
        alt="Desktop and mobile mockups of the platform"
        class="mb-14"
      />

      <section>
        <h1
          class="font-primary mb-6 text-2xl font-semibold md:max-w-130 md:text-[40px]"
        >
          Build The Community Your Fans Will Love
        </h1>

        <p class="mb-8 text-base tracking-wide md:mb-10 md:max-w-120">
          Huddle re-imagines the way we build communities. You have a voice, but
          so does your audience. Create connections with your users as you
          engage in genuine discussion.
        </p>

        <button
          type="button"
          class="text-primary font-primary hover:bg-secondary mb-15.5 w-50 cursor-pointer rounded-[20px] bg-white py-2.75 text-xs shadow-md duration-75 ease-in hover:text-white md:rounded-[28px] md:py-3.5 md:text-lg"
        >
          Register
        </button>
      </section>

      <nav
        aria-label="Social media"
        class="mb-10 flex justify-center gap-4 md:col-start-2 md:self-end md:justify-self-end"
      >
        <a
          href="#"
          aria-label="Facebook"
          class="hover:text-pink hover:border-pink flex h-8 w-8 cursor-pointer items-center justify-center rounded-full border border-white duration-75 ease-in md:h-10 md:w-10 md:text-xl"
        >
          <i class="fa-brands fa-facebook-f"></i>
        </a>

        <a
          href="#"
          aria-label="Twitter"
          class="hover:text-pink hover:border-pink flex h-8 w-8 cursor-pointer items-center justify-center rounded-full border border-white duration-75 ease-in md:h-10 md:w-10 md:text-xl"
        >
          <i class="fa-brands fa-twitter"></i>
        </a>

        <a
          href="#"
          aria-label="Instagram"
          class="hover:text-pink hover:border-pink flex h-8 w-8 cursor-pointer items-center justify-center rounded-full border border-white duration-75 ease-in md:h-10 md:w-10 md:text-xl"
        >
          <i class="fa-brands fa-instagram"></i>
        </a>
      </nav>
    </main>

    <footer class="font-primary text-center text-xs">
      <p>
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" class="font-bold">
          Frontend Mentor </a
        >. Coded by
        <a href="https://github.com/gustavogularte" class="font-bold">
          Gustavo Arend </a
        >.
      </p>
    </footer>
  </body>
</html>
